<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olist Logistics DSS</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: #f8fafc; color: #1e293b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: #fff; border: 1px solid #e8edf3; border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  input[type=range] { accent-color: #7aa7e0; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadein .25s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { ResponsiveContainer, BarChart, Bar, LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, Tooltip, CartesianGrid, ReferenceDot } = Recharts;

const BLUE = '#7aa7e0', RED = '#e59a9a', AMBER = '#e8c27a', GRID = '#eef2f6', MUTED = '#94a3b8';

/* Lucide-style inline icons (no extra network dependency) */
const P = {
  dashboard: <><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></>,
  dss: <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>,
  olap: <><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></>,
  etl: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0"/></>,
  play: <polygon points="6 3 20 12 6 21 6 3"/>,
  alert: <path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3zM12 9v4M12 17h.01"/>,
  check: <path d="M20 6 9 17l-5-5"/>,
  x: <path d="M18 6 6 18M6 6l12 12"/>,
  sort: <path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>,
  up: <path d="m18 15-6-6-6 6"/>,
  down: <path d="m6 9 6 6 6-6"/>,
  truck: <><path d="M10 17h4V5H2v12h3M20 17h2v-5l-3-4h-4v9h2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>,
  loader: <path d="M21 12a9 9 0 1 1-6.2-8.55"/>,
};
const Icon = ({ n, size = 18, className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>{P[n]}</svg>
);

const TABS = [
  { id: 'dashboard', label: 'BI Dashboard', icon: 'dashboard' },
  { id: 'dss', label: 'DSS Action Center', icon: 'dss' },
  { id: 'olap', label: 'OLAP Query', icon: 'olap' },
  { id: 'etl', label: 'ETL Monitor', icon: 'etl' },
];
const STATES = ['SP', 'RJ', 'MG', 'RS', 'PR'];
const CATS = ['Electronics', 'Furniture', 'Toys', 'Health & Beauty'];
const QTRS = ['Q1', 'Q2', 'Q3', 'Q4'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const Select = ({ value, onChange, options, label }) => (
  <label className="flex items-center gap-2 text-xs text-slate-500">
    <span className="hidden sm:inline">{label}</span>
    <select value={value} onChange={e => onChange(e.target.value)}
      className="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200">
      {options.map(o => <option key={o}>{o}</option>)}
    </select>
  </label>
);

const Card = ({ title, children, className = '', right }) => (
  <div className={`card p-5 ${className}`}>
    {title && <div className="flex items-center justify-between mb-4"><h3 className="text-sm font-medium text-slate-600">{title}</h3>{right}</div>}
    {children}
  </div>
);

/* ---------- VIEW 1 ---------- */
function Dashboard({ f }) {
  const k = (f.year === 'All' ? 1 : f.year === '2017' ? 0.45 : 0.55) * (f.quarter === 'All' ? 1 : 0.25) * (f.state === 'All' ? 1 : 0.3);
  const month = f.month === 'All' ? 1 : 0.2;
  const sc = k * month;
  const fmt = n => Math.round(n).toLocaleString();
  const cards = [
    { l: 'Total Orders', v: fmt(99441 * sc), s: 'delivered & shipped' },
    { l: 'SLA Violation Rate', v: (8.1 + (f.state === 'RJ' ? 3.2 : f.state === 'SP' ? -1.1 : 0.6)).toFixed(1) + '%', s: 'vs 7.5% target', warn: true },
    { l: 'Avg Freight Cost', v: 'R$ ' + (f.state === 'All' ? 19.9 : 21.4).toFixed(2), s: 'per order' },
    { l: 'Avg Transit Time', v: (12.1 + (f.state === 'RJ' ? 1.8 : 0)).toFixed(1) + ' days', s: 'purchase → delivery' },
  ];
  const states = [['SP', 3420], ['RJ', 2315], ['MG', 1180], ['RS', 640], ['PR', 520]]
    .filter(([s]) => f.state === 'All' || s === f.state).map(([s, v]) => ({ s, v: Math.round(v * (f.year === 'All' ? 1 : 0.5) * (f.quarter === 'All' ? 1 : 0.25)) }));
  const trend = MONTHS.map((m, i) => ({ m, v: Math.round((260 + 90 * Math.sin(i / 1.8) + i * 14) * (f.state === 'All' ? 1 : 0.35)) }));
  const causes = [{ n: 'Carrier', v: 52, c: BLUE }, { n: 'Seller', v: 33, c: AMBER }, { n: 'Weather', v: 15, c: RED }];
  const tip = { contentStyle: { borderRadius: 10, border: '1px solid #e8edf3', boxShadow: 'none', fontSize: 12 } };
  return (
    <div className="space-y-6 fade">
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
        {cards.map(c => (
          <div key={c.l} className="card p-5">
            <div className="text-xs text-slate-500">{c.l}</div>
            <div className={`text-2xl font-semibold mt-2 ${c.warn ? 'text-red-400' : 'text-slate-800'}`}>{c.v}</div>
            <div className="text-xs text-slate-400 mt-1">{c.s}</div>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card title="Top States by Delay Count">
          <div className="h-64"><ResponsiveContainer><BarChart data={states} barSize={28}>
            <CartesianGrid vertical={false} stroke={GRID} /><XAxis dataKey="s" tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} /><Tooltip {...tip} cursor={{ fill: '#f1f5f9' }} />
            <Bar dataKey="v" name="Delays" fill={BLUE} radius={[6, 6, 0, 0]} /></BarChart></ResponsiveContainer></div>
        </Card>
        <Card title="Delay Trend over Time">
          <div className="h-64"><ResponsiveContainer><LineChart data={trend}>
            <CartesianGrid vertical={false} stroke={GRID} /><XAxis dataKey="m" tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} /><Tooltip {...tip} />
            <Line type="monotone" dataKey="v" name="Delays" stroke={BLUE} strokeWidth={2.5} dot={false} activeDot={{ r: 5 }} /></LineChart></ResponsiveContainer></div>
        </Card>
        <Card title="Root Causes of Delays">
          <div className="h-52"><ResponsiveContainer><PieChart>
            <Pie data={causes} dataKey="v" nameKey="n" innerRadius={55} outerRadius={80} paddingAngle={3} stroke="none">
              {causes.map(c => <Cell key={c.n} fill={c.c} />)}</Pie><Tooltip {...tip} formatter={v => v + '%'} /></PieChart></ResponsiveContainer></div>
          <div className="flex justify-center gap-4 text-xs text-slate-500 mt-2">
            {causes.map(c => <span key={c.n} className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.c }} />{c.n} {c.v}%</span>)}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ---------- VIEW 2: DSS Action Center (redesigned: Route Priority > Root Cause > Scenario > Recommendation) ---------- */
const DS_ST = [
  { k: 'approval', f: 'ap', l: 'Payment approval', tip: 'Review the payment approval step for this route.' },
  { k: 'prep', f: 'pr', l: 'Seller preparation', tip: 'Work with the sellers on this route to shorten preparation time.' },
  { k: 'transit', f: 'tr', l: 'Carrier transit', tip: 'Review the carrier for this route or adjust the delivery promise.' },
];
const DSS_API = 'http://localhost:8000/api/dss';

function DSS({ toast }) {
  const [year, setYear] = useState('all');
  const [pri, setPri] = useState([]);
  const [sel, setSel] = useState(null);
  const [cut, setCut] = useState({ approval: 0, prep: 0, transit: 0 });
  const [target, setTarget] = useState(5);
  const [sc, setSc] = useState(null);
  const [pm, setPm] = useState(null);
  const [log, setLog] = useState([]);
  const [loadingPri, setLoadingPri] = useState(true);
  const [loadingSc, setLoadingSc] = useState(false);
  const [loadingPm, setLoadingPm] = useState(false);
  const [listError, setListError] = useState('');
  const [scError, setScError] = useState('');
  const [pmError, setPmError] = useState('');
  const [actionMsg, setActionMsg] = useState('');
  const [applying, setApplying] = useState(false);
  const [insightData, setInsightData] = useState({});
  const [insightErrors, setInsightErrors] = useState({});
  const [insightLoading, setInsightLoading] = useState(true);

  const route = pri.some(p => p.route === sel) ? sel : (pri[0] && pri[0].route);
  const chosen = pri.find(p => p.route === route) || null;
  const root = chosen && chosen.root_cause;
  const stageLabel = k => (DS_ST.find(s => s.k === k) || { l: k }).l;
  const pct = v => (v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%');
  const pct1 = v => (v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%');
  const fixed = (v, d = 2) => (v == null ? '—' : Number(v).toFixed(d).replace('.', ','));

  useEffect(() => {
    let cancelled = false;
    const q = year === 'all' ? '' : `?year=${encodeURIComponent(year)}`;
    const endpoints = {
      brief: `${DSS_API}/brief${q}`,
      sellers: `${DSS_API}/sellers${q}`,
      policy: `${DSS_API}/promise-policy${q}`,
    };
    setInsightData({});
    setInsightErrors({});
    setInsightLoading(true);
    Promise.all(Object.entries(endpoints).map(async ([key, url]) => {
      try {
        const response = await fetch(url);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return [key, { data: body }];
      } catch (error) {
        return [key, { error: error.message }];
      }
    })).then(results => {
      if (cancelled) return;
      const data = {};
      const errors = {};
      results.forEach(([key, result]) => {
        if (result.data) data[key] = result.data;
        if (result.error) errors[key] = result.error;
      });
      setInsightData(data);
      setInsightErrors(errors);
    }).finally(() => {
      if (!cancelled) setInsightLoading(false);
    });
    return () => { cancelled = true; };
  }, [year]);

  // Khối 1: nạp danh sách tuyến từ Django API.
  useEffect(() => {
    let cancelled = false;
    setLoadingPri(true);
    setListError('');
    const q = year === 'all' ? '' : '?year=' + encodeURIComponent(year);
    fetch(`${DSS_API}/routes${q}`)
      .then(async r => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        return d;
      })
      .then(d => {
        if (cancelled) return;
        setPri(d);
        setSel(prev => (d.some(p => p.route === prev) ? prev : (d[0] && d[0].route)));
      })
      .catch(e => {
        if (cancelled) return;
        setPri([]);
        setSel(null);
        setListError(`Không tải được dữ liệu từ API Django (${DSS_API}). Kiểm tra server đã chạy chưa. Chi tiết: ${e.message}`);
      })
      .finally(() => { if (!cancelled) setLoadingPri(false); });
    return () => { cancelled = true; };
  }, [year]);

  // Đổi tuyến/năm thì đưa thanh trượt về 0.
  useEffect(() => { setCut({ approval: 0, prep: 0, transit: 0 }); }, [route, year]);

  // Khối 3: What-if, debounce 250ms cho thanh trượt.
  useEffect(() => {
    if (!route) { setSc(null); return; }
    const ctrl = new AbortController();
    setLoadingSc(true);
    setScError('');
    const q = new URLSearchParams({
      route,
      approval: String(cut.approval),
      prep: String(cut.prep),
      transit: String(cut.transit),
    });
    if (year !== 'all') q.set('year', year);
    const timer = setTimeout(() => {
      fetch(`${DSS_API}/scenario?${q.toString()}`, { signal: ctrl.signal })
        .then(async r => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
          return d;
        })
        .then(d => setSc(d))
        .catch(e => {
          if (e.name === 'AbortError') return;
          setSc(null);
          setScError(`Không tính được kịch bản. Chi tiết: ${e.message}`);
        })
        .finally(() => { if (!ctrl.signal.aborted) setLoadingSc(false); });
    }, 250);
    return () => { clearTimeout(timer); ctrl.abort(); };
  }, [route, cut, year]);

  // Khối 4: goal seek cam kết giao hàng.
  useEffect(() => {
    if (!route) { setPm(null); return; }
    const ctrl = new AbortController();
    setLoadingPm(true);
    setPmError('');
    const q = new URLSearchParams({ route, target: String(target / 100) });
    if (year !== 'all') q.set('year', year);
    const timer = setTimeout(() => {
      fetch(`${DSS_API}/promise?${q.toString()}`, { signal: ctrl.signal })
        .then(async r => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
          return d;
        })
        .then(d => setPm(d))
        .catch(e => {
          if (e.name === 'AbortError') return;
          setPm(null);
          setPmError(`Không tính được mục tiêu. Chi tiết: ${e.message}`);
        })
        .finally(() => { if (!ctrl.signal.aborted) setLoadingPm(false); });
    }, 250);
    return () => { clearTimeout(timer); ctrl.abort(); };
  }, [route, target, year]);

  // Nạp log hành động thật đã lưu trên server.
  useEffect(() => {
    fetch(`${DSS_API}/actions`)
      .then(r => (r.ok ? r.json() : []))
      .then(d => setLog(Array.isArray(d) ? d : []))
      .catch(() => {});
  }, []);

  const series = (sc && sc.series ? sc.series : []).map(x => ({
    d: x.cut,
    v: +(x.projected * 100).toFixed(2),
  }));

  const apply = () => {
    if (!route || !pm) return;
    setApplying(true);
    setActionMsg('');
    fetch(`${DSS_API}/actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'extend_promise',
        route,
        level: chosen ? chosen.level : '',
        target_pct: target,
        extra_days: pm.extra_days,
        late_after: pm.late_after,
      }),
    })
      .then(async r => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        return d;
      })
      .then(async d => {
        if (!d.ok) throw new Error('server không xác nhận hành động');
        setActionMsg(`Server đã ghi: kéo dài cam kết ${pm.extra_days} ngày cho ${route} (target ${target}%).`);
        toast(`Đã ghi hành động cho ${route}`);
        const list = await fetch(`${DSS_API}/actions`);
        if (list.ok) setLog(await list.json());
      })
      .catch(e => {
        setActionMsg(`Không gửi được hành động: ${e.message}`);
        toast(`Lỗi ghi hành động: ${e.message}`);
      })
      .finally(() => setApplying(false));
  };

  const lv = { red: 'bg-red-50/60 border-red-100 text-red-500', amber: 'bg-amber-50/60 border-amber-100 text-amber-500' };
  const excessMax = root ? Math.max(...DS_ST.map(s => Math.abs((root.excess && root.excess[s.k]) || 0)), 0.001) : 1;
  const briefGroups = insightData.brief ? [
    {
      key: 'route_actions',
      title: 'Theo tuyến',
      scope: `Tối đa 3 dòng trong top ${insightData.brief.parameters?.top_routes ?? 5} tuyến theo S4 peer P25.`,
      rows: insightData.brief.route_actions || [],
    },
    {
      key: 'payment_actions',
      title: 'Theo loại thanh toán',
      scope: `Tối đa 3 dòng trong top ${insightData.brief.parameters?.top_payment ?? 5} payment_type, chỉ approval và tác động thấp.`,
      rows: insightData.brief.payment_actions || [],
    },
    {
      key: 'promise_actions',
      title: 'Theo promise',
      scope: `Tối đa 3 dòng trong top ${insightData.brief.parameters?.top_routes ?? 5} ô tuyến × weight_band theo NET.`,
      rows: insightData.brief.promise_actions || [],
    },
    {
      key: 'seller_actions',
      title: 'Theo seller',
      scope: `Tối đa 3 dòng trong top ${insightData.brief.parameters?.top_sellers ?? 5} seller theo excess; chỉ đơn single-seller.`,
      rows: insightData.brief.seller_actions || [],
    },
    {
      key: 'low_sample_actions',
      title: 'Cần thêm dữ liệu',
      scope: `Tối đa 3 dòng trong top ${insightData.brief.parameters?.top_low_sample ?? 5} tuyến mẫu nhỏ có tín hiệu (<${insightData.brief.parameters?.low_sample_threshold ?? 200} đơn).`,
      rows: insightData.brief.low_sample_actions || [],
    },
  ] : [];

  return (
    <div className="space-y-6 fade">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="text-sm font-medium text-slate-600">DSS Action Center
          <span className="text-xs text-slate-400 ml-2">live API · {DSS_API}</span></h2>
        <select value={year} onChange={e => setYear(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-slate-600">
          <option value="all">All years</option><option value="2016">2016</option><option value="2017">2017</option><option value="2018">2018</option></select>
      </div>

      {listError && <div className="rounded-xl border border-red-100 bg-red-50/60 px-4 py-3 text-sm text-red-500">{listError}</div>}

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card title="Decision Brief">
          {insightLoading && !insightData.brief && <div className="text-sm text-slate-400">Đang tải Decision Brief…</div>}
          {insightErrors.brief && <div className="text-sm text-red-500">Không tải được /brief: {insightErrors.brief}</div>}
          {insightData.brief && <>
            <div className="text-xs text-slate-500 mb-3">
              S3 NET toàn bộ ô đủ mẫu (tham chiếu, không phải tổng nhóm top-N): {insightData.brief.promise_summary?.net_avoided_orders ?? '—'} đơn-tuyến; đổi định nghĩa trễ, không rút ngắn thời gian giao.
            </div>
            <div className="space-y-4">
              {briefGroups.map(group => (
                <section key={group.key} className="border-t border-slate-100 pt-3">
                  <h4 className="text-xs font-semibold text-slate-700">{group.title}</h4>
                  <p className="text-xs text-slate-400 mt-1">{group.scope}</p>
                  <div className="space-y-2 mt-2">
                    {group.rows.slice(0, 3).map((row, i) => {
                      const gmv = `${Number(row.gmv || 0).toLocaleString('vi-VN')} R$`;
                      const action = row.action?.replace(
                        /(GMV (?:tuyến|nhóm|ô|seller) [\d.]+)/g,
                        '$1 R$'
                      );
                      let label;
                      if (group.key === 'route_actions') {
                        label = `Tuyến ${row.route} · ${row.avoided_orders} đơn-tuyến · GMV ${gmv}`;
                      } else if (group.key === 'payment_actions') {
                        label = `${row.payment_type} · ${row.avoided_orders} đơn-tuyến · GMV ${gmv}`;
                      } else if (group.key === 'promise_actions') {
                        label = `${row.route} × ${row.weight_band} · NET ${row.net_avoided_orders} đơn-tuyến · GMV ${gmv}`;
                      } else if (group.key === 'seller_actions') {
                        label = `Seller ${String(row.seller_id).slice(0, 8)}… · excess ${row.estimated_excess_late_orders} (liên hệ) · GMV ${gmv}`;
                      } else {
                        label = `Tuyến ${row.route} · ${row.late_orders}/${row.orders} đơn-tuyến trễ · GMV ${gmv}`;
                      }
                      return (
                        <div key={`${group.key}-${i}`} className="border-t border-slate-100 pt-2">
                          <div className="text-xs font-medium text-slate-700">{label}</div>
                          {action && <div className="text-xs text-slate-500 mt-1">{action}</div>}

                {pm ? <>Nếu đổi cam kết +<b className="text-slate-800">{pm.extra_days}</b> ngày thì tỷ lệ trễ theo định nghĩa mới ước tính <b className="text-slate-800">{pct(pm.late_after)}</b>; đổi định nghĩa trễ, không rút ngắn thời gian giao.</>
                  : <span>{loadingPm ? 'Đang tính goal seek…' : 'Chưa có kết quả goal seek.'}</span>}

              <button onClick={apply} disabled={!pm || applying || loadingPm}

                <Icon n="check" size={15} />{applying ? 'Đang ghi…' : 'Apply'}</button>
              {actionMsg && <div className="text-xs text-slate-500 mt-3">{actionMsg}</div>}
              {log.length > 0 && <ul className="mt-3 text-xs text-slate-500 space-y-1">{log.slice(0, 3).map((l, i) => (
                <li key={i}>{l.created_at ? new Date(l.created_at).toLocaleString() : ''} · {l.action} · {l.route}</li>))}</ul>}
            </Card>
          </div>

          <div className="lg:col-span-3">
            <Card title="3. Scenario (What-if)" right={<span className="text-xs text-slate-400">cut stage time (days) → projected late rate</span>}>
              <div className="grid md:grid-cols-2 gap-8">
                <div className="space-y-5">{DS_ST.map(s => (
                  <div key={s.k}><div className="flex justify-between text-sm"><span className="text-slate-600">Cut {s.l}</span><span className="font-semibold text-slate-800">{cut[s.k]}d</span></div>
                    <input type="range" min="0" max="5" step="1" value={cut[s.k]} onChange={e => setCut({ ...cut, [s.k]: +e.target.value })} className="w-full mt-2" /></div>))}
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-100">
                    <div className="text-xs text-slate-500">Projected late rate</div>
                    <div className="flex items-baseline gap-3 mt-1"><span className="text-3xl font-semibold text-slate-800">{sc ? pct(sc.projected) : '—'}</span>
                      <span className="text-sm text-emerald-600">{sc && sc.avoided > 0 ? `↓ from ${pct(sc.baseline)} · ${sc.avoided} late orders avoided` : sc ? 'baseline ' + pct(sc.baseline) : ''}</span></div>
                    {loadingSc && <div className="text-xs text-slate-400 mt-1">Đang tính…</div>}
                    {scError && <div className="text-xs text-red-500 mt-1">{scError}</div>}
                  </div>
                </div>
                <div className="h-56"><ResponsiveContainer><LineChart data={series} margin={{ top: 10, right: 10 }}>
                  <CartesianGrid vertical={false} stroke={GRID} /><XAxis dataKey="d" tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} unit="d" />
                  <YAxis tick={{ fontSize: 12, fill: MUTED }} axisLine={false} tickLine={false} unit="%" tickFormatter={v => String(v).replace('.', ',')} />
                  <Tooltip contentStyle={{ borderRadius: 10, border: '1px solid #e8edf3', boxShadow: 'none', fontSize: 12 }} formatter={v => String(v).replace('.', ',') + '%'} />
                  <Line type="monotone" dataKey="v" name={`Cut ${stageLabel(root.stage)}`} stroke={BLUE} strokeWidth={2.5} dot={false} />
                  {sc && <ReferenceDot x={cut[root.stage]} y={+(sc.projected * 100).toFixed(2)} r={6} fill={BLUE} stroke="#fff" strokeWidth={2} />}</LineChart></ResponsiveContainer>
                  <div className="text-xs text-slate-400 text-center">Chart: cutting {stageLabel(root.stage)} by 0–5 days{root.has_bottleneck ? ' (bottleneck stage)' : ''}</div></div>
              </div>
            </Card>
          </div>
        </>)}
      </div>
    </div>
  );
}

/* ---------- VIEW 3: OLAP (redesigned from the star schema) ---------- */
// Fields come from Fact_Delivery_SLA + Dim_Time / Dim_Location / Dim_Product. `child` = next hierarchy level (drill-down).
const OL_DIMS = {
  year: { l: 'Year', child: 'quarter' }, quarter: { l: 'Quarter', child: 'month' }, month: { l: 'Month' }, dow: { l: 'Day of Week' },
  cstate: { l: 'Customer State', child: 'ccity' }, ccity: { l: 'Customer City' },
  sstate: { l: 'Seller State', child: 'scity' }, scity: { l: 'Seller City' },
  cat: { l: 'Product Category' }, pay: { l: 'Payment Type' }, status: { l: 'Delivery Status' },
};
const OL_DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const OL_LOC = { SP: ['sao paulo', 'campinas'], RJ: ['rio de janeiro', 'niteroi'], MG: ['belo horizonte', 'uberlandia'], RS: ['porto alegre', 'caxias do sul'], PR: ['curitiba', 'londrina'] };
const OL_CATS = ['health_beauty', 'bed_bath_table', 'sports_leisure', 'computers_accessories', 'furniture_decor'];
const OL_PAY = ['credit_card', 'boleto', 'voucher', 'debit_card'];

// SAMPLE DATA (one row = one order item). Replace with the result of the warehouse query (e.g. POST /api/olap/query).
const OL_RAW = (() => {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)], st = Object.keys(OL_LOC), out = [];
  for (let i = 1; i <= 700; i++) {
    const cs = rnd() < 0.5 ? 'SP' : pick(st), ss = rnd() < 0.55 ? 'SP' : pick(st);
    const m = Math.floor(rnd() * 12), approval = 0.2 + rnd() * 1.2, prep = 1 + rnd() * 4 + (ss === 'MG' ? 1 : 0);
    const transit = 3 + rnd() * 7 + (cs !== ss ? 3 : 0) + (cs === 'RJ' ? 1.5 : 0);
    const late = prep + transit > 9.5 ? rnd() < 0.7 : rnd() < 0.05;
    const base = { oid: 'o' + i, cstate: cs, ccity: pick(OL_LOC[cs]), sstate: ss, scity: pick(OL_LOC[ss]), year: rnd() < 0.35 ? 2017 : 2018,
      quarter: 'Q' + (Math.floor(m / 3) + 1), month: MONTHS[m], dow: pick(OL_DOW), pay: pick(OL_PAY), status: late ? 'Late' : 'On time',
      late, review: late ? 1 + Math.floor(rnd() * 3) : 3 + Math.floor(rnd() * 3), approval, prep, transit };
    for (let k = rnd() < 0.2 ? 2 : 1; k > 0; k--) out.push({ ...base, cat: pick(OL_CATS), freight: +(8 + rnd() * 30).toFixed(2) });
  }
  return out;
})();

// Fact grain = order item, so order-level measures use distinct order ids.
const olAgg = rows => {
  const ord = new Map(); let fr = 0, ap = 0, pr = 0, tr = 0;
  rows.forEach(r => { fr += r.freight; ap += r.approval; pr += r.prep; tr += r.transit; if (!ord.has(r.oid)) ord.set(r.oid, r); });
  const o = [...ord.values()], n = o.length || 1, k = rows.length || 1;
  return { n: o.length, items: k, fr, late: o.filter(r => r.late).length / n, review: o.reduce((t, r) => t + r.review, 0) / n, ap: ap / k, pr: pr / k, tr: tr / k };
};
const olDays = v => v.toFixed(1);
const OL_MEAS = {
  orders: { l: 'Order Count', v: g => g.n, f: v => v.toLocaleString() },
  freight: { l: 'Total Freight', v: g => g.fr, f: v => 'R$ ' + Math.round(v).toLocaleString() },
  avgfr: { l: 'Avg Freight', v: g => g.fr / g.items, f: v => 'R$ ' + v.toFixed(2) },
  late: { l: 'Late Rate', v: g => g.late, f: v => (v * 100).toFixed(1) + '%' },
  review: { l: 'Avg Review Score', v: g => g.review, f: v => v.toFixed(2) },
  appr: { l: 'Avg Approval Time (days)', v: g => g.ap, f: olDays },
  prep: { l: 'Avg Seller Prep Time (days)', v: g => g.pr, f: olDays },
  trans: { l: 'Avg Carrier Transit Time (days)', v: g => g.tr, f: olDays },
  total: { l: 'Avg Delivery Time (days)', v: g => g.ap + g.pr + g.tr, f: olDays },
};
const olOrd = (f, v) => f === 'month' ? MONTHS.indexOf(v) : f === 'dow' ? OL_DOW.indexOf(v) : v;
const olCmp = fs => (a, b) => { for (let i = 0; i < fs.length; i++) { const x = olOrd(fs[i], a[i]), y = olOrd(fs[i], b[i]); if (x !== y) return x > y ? 1 : -1; } return 0; };
const olVals = f => [...new Set(OL_RAW.map(r => r[f]))].sort((a, b) => olCmp([f])([a], [b]));

function OLAP() {
  const [rows, setRows] = useState(['cstate']);
  const [cols, setCols] = useState(['year']);
  const [meas, setMeas] = useState(['orders', 'late']);
  const [filt, setFilt] = useState({});   // Filters zone: { field: [selected values] }, empty list = all (dice)
  const [slice, setSlice] = useState({}); // created by drill-down: { field: value }
  const [sort, setSort] = useState(null); // { ck, m, dir }
  const [over, setOver] = useState(null);
  const rm = (a, k) => a.filter(x => x !== k);

  const place = (z, key) => {
    if (z === 'meas') { if (OL_MEAS[key] && !meas.includes(key)) setMeas([...meas, key]); return; }
    if (!OL_DIMS[key]) return;
    const nf = { ...filt }; delete nf[key];
    setRows(z === 'rows' ? [...rm(rows, key), key] : rm(rows, key));
    setCols(z === 'cols' ? [...rm(cols, key), key] : rm(cols, key));
    setFilt(z === 'filt' ? { ...nf, [key]: [] } : nf);
  };
  const drill = (zone, f, v) => {
    const c = OL_DIMS[f].child;
    if (!c || rows.includes(c) || cols.includes(c) || filt[c]) return;
    const ins = a => { const i = a.indexOf(f); return [...a.slice(0, i + 1), c, ...a.slice(i + 1)]; };
    zone === 'rows' ? setRows(ins(rows)) : setCols(ins(cols));
    setSlice({ ...slice, [f]: String(v) });
  };
  const rollup = f => {
    const s = { ...slice }; delete s[f]; let r = rows, k = cols, c = OL_DIMS[f].child;
    while (c) { delete s[c]; r = rm(r, c); k = rm(k, c); c = OL_DIMS[c].child; }
    setSlice(s); setRows(r); setCols(k);
  };
  const toggle = (f, v) => setFilt({ ...filt, [f]: filt[f].includes(v) ? rm(filt[f], v) : [...filt[f], v] });

  const view = useMemo(() => {
    const sel = OL_RAW.filter(r => Object.entries(filt).every(([f, v]) => !v.length || v.includes(String(r[f]))) && Object.entries(slice).every(([f, v]) => String(r[f]) === v));
    const R = {}, C = {};
    sel.forEach(r => {
      const rv = rows.map(f => r[f]), cv = cols.map(f => r[f]), a = rv.join(' / '), b = cv.join(' / ') || 'Total';
      const row = R[a] || (R[a] = { vals: rv, cells: {} });
      (row.cells[b] || (row.cells[b] = [])).push(r);
      if (!C[b]) C[b] = cv;
    });
    const ckeys = Object.keys(C).sort((x, y) => olCmp(cols)(C[x], C[y]));
    let list = Object.values(R).sort((x, y) => olCmp(rows)(x.vals, y.vals));
    if (sort && ckeys.includes(sort.ck) && meas.includes(sort.m)) {
      const val = r => { const it = r.cells[sort.ck]; return it ? OL_MEAS[sort.m].v(olAgg(it)) : -Infinity; };
      list = [...list].sort((x, y) => (val(x) > val(y) ? 1 : val(x) < val(y) ? -1 : 0) * sort.dir);
    }
    return { list, ckeys };
  }, [rows, cols, meas, filt, slice, sort]);

  const Pill = ({ id, drag, onRemove }) => {
    const dim = !!OL_DIMS[id], lab = dim ? OL_DIMS[id].l : OL_MEAS[id].l;
    return (
      <span draggable={drag} onDragStart={e => e.dataTransfer.setData('text', id)}
        className={`inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border ${drag ? 'cursor-grab bg-white text-slate-600 border-slate-200 hover:border-blue-200' : dim ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-amber-50 text-amber-700 border-amber-100'}`}>
        {lab}{onRemove && <button onClick={onRemove} className="opacity-60 hover:opacity-100"><Icon n="x" size={12} /></button>}
      </span>
    );
  };
  const Zone = ({ z, title, empty, children }) => (
    <div onDragOver={e => { e.preventDefault(); setOver(z); }} onDragLeave={() => setOver(null)}
      onDrop={e => { e.preventDefault(); setOver(null); place(z, e.dataTransfer.getData('text')); }}
      className={`rounded-xl border-2 border-dashed p-4 min-h-[88px] transition ${over === z ? 'border-blue-300 bg-blue-50/40' : 'border-slate-200 bg-slate-50/50'}`}>
      <div className="text-xs font-medium text-slate-500 mb-3">{title}</div>
      <div className="flex flex-wrap gap-2">{empty ? <span className="text-xs text-slate-400">Drop fields here</span> : children}</div>
    </div>
  );
  const dimZone = (z, arr, set) => arr.map(f => <Pill key={f} id={f} onRemove={() => set(rm(arr, f))} />);

  const none = rows.length + cols.length === 0 || meas.length === 0;
  const rh = rows.length ? rows : [null];
  return (
    <div className="space-y-6 fade">
      <Card title="Query Builder" right={<span className="text-xs text-slate-400">Drag fields into a zone · sample data</span>}>
        <div className="flex flex-wrap gap-2 mb-2">{Object.keys(OL_DIMS).map(k => <Pill key={k} id={k} drag />)}</div>
        <div className="flex flex-wrap gap-2 mb-4">{Object.keys(OL_MEAS).map(k => <Pill key={k} id={k} drag />)}</div>
        <div className="grid md:grid-cols-2 gap-4">
          <Zone z="rows" title="Rows" empty={!rows.length}>{dimZone('rows', rows, setRows)}</Zone>
          <Zone z="cols" title="Columns" empty={!cols.length}>{dimZone('cols', cols, setCols)}</Zone>
          <Zone z="meas" title="Measures" empty={!meas.length}>{meas.map(m => <Pill key={m} id={m} onRemove={() => setMeas(rm(meas, m))} />)}</Zone>
          <Zone z="filt" title="Filters (select values; none = all)" empty={!Object.keys(filt).length}>
            {Object.keys(filt).map(f => (
              <div key={f} className="w-full space-y-1.5">
                <Pill id={f} onRemove={() => { const n = { ...filt }; delete n[f]; setFilt(n); }} />
                <div className="flex flex-wrap gap-1.5">{olVals(f).map(v => (
                  <button key={v} onClick={() => toggle(f, String(v))}
                    className={`text-xs px-2 py-0.5 rounded-md border ${filt[f].includes(String(v)) ? 'bg-blue-100 border-blue-200 text-blue-700' : 'bg-white border-slate-200 text-slate-500'}`}>{v}</button>))}</div>
              </div>))}
          </Zone>
        </div>
      </Card>
      <Card title={`Pivot Table · ${none ? 0 : view.list.length} rows`}
        right={<span className="text-xs text-slate-400">Click a row value to drill down</span>}>
        {Object.keys(slice).length > 0 && (
          <div className="flex flex-wrap gap-2 mb-3">{Object.entries(slice).map(([f, v]) => (
            <span key={f} className="inline-flex items-center gap-1.5 text-xs px-3 py-1 rounded-full bg-slate-100 text-slate-600">
              {OL_DIMS[f].l} = {v}<button onClick={() => rollup(f)} className="text-blue-600 hover:underline">roll up</button></span>))}</div>)}
        {none ? <div className="text-sm text-slate-400 py-10 text-center">Select at least one dimension (Rows or Columns) and one measure.</div> : (
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100">
                {rh.map((f, i) => <th key={i} rowSpan={2} className="py-2.5 px-3 text-left font-medium text-xs text-slate-500 whitespace-nowrap">{f ? OL_DIMS[f].l : 'All'}</th>)}
                {view.ckeys.map(k => <th key={k} colSpan={meas.length} className="py-2 px-3 text-center font-medium text-xs text-slate-600 border-l border-slate-100">{k}</th>)}
              </tr>
              <tr className="border-b border-slate-200">
                {view.ckeys.flatMap(k => meas.map(m => (
                  <th key={k + m} onClick={() => setSort({ ck: k, m, dir: sort && sort.ck === k && sort.m === m ? -sort.dir : 1 })}
                    className="py-2 px-3 text-right font-medium text-xs text-slate-500 cursor-pointer select-none whitespace-nowrap">
                    <span className="inline-flex items-center gap-1">{OL_MEAS[m].l}<Icon n={sort && sort.ck === k && sort.m === m ? (sort.dir === 1 ? 'up' : 'down') : 'sort'} size={13} className={sort && sort.ck === k && sort.m === m ? 'text-blue-400' : 'text-slate-300'} /></span>
                  </th>)))}
              </tr>
            </thead>
            <tbody>{view.list.map((r, i) => (
              <tr key={i} className="border-b border-slate-100 hover:bg-slate-50/70">
                {rh.map((f, j) => <td key={j} className="py-2.5 px-3 text-slate-700 whitespace-nowrap">
                  {f && OL_DIMS[f].child ? <button onClick={() => drill('rows', f, r.vals[j])} className="text-blue-600 hover:underline">{r.vals[j]}</button> : f ? r.vals[j] : 'All'}</td>)}
                {view.ckeys.flatMap(k => meas.map(m => { const it = r.cells[k]; return (
                  <td key={k + m} className="py-2.5 px-3 text-right tabular-nums text-slate-600">{it ? OL_MEAS[m].f(OL_MEAS[m].v(olAgg(it))) : '—'}</td>); }))}
              </tr>))}</tbody>
          </table></div>
        )}
      </Card>
    </div>
  );
}

/* ---------- VIEW 4 ---------- */
function ETL({ toast }) {
  const [runs, setRuns] = useState([
    { id: 3, ok: true, t: '21 Oct 2026, 02:00', d: '4m 12s' },
    { id: 2, ok: false, t: '20 Oct 2026, 02:00', d: '1m 47s', e: 'Source timeout on olist_orders' },
    { id: 1, ok: true, t: '19 Oct 2026, 02:00', d: '4m 05s' },
  ]);
  const [running, setRunning] = useState(false);
  const run = () => {
    setRunning(true);
    setTimeout(() => {
      setRuns(r => [{ id: r[0].id + 1, ok: true, t: new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }), d: '4m 08s' }, ...r].slice(0, 3));
      setRunning(false); toast('ETL pipeline completed successfully');
    }, 2500);
  };
  const stats = [['Fact_Delivery_SLA', '100,000'], ['Dim_Location', '4,000'], ['Dim_Seller', '3,095'], ['Dim_Product', '32,951'], ['Dim_Customer', '96,096'], ['Dim_Date', '1,461']];
  return (
    <div className="space-y-6 fade">
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div><div className="text-sm font-medium text-slate-700">Data Warehouse Pipeline</div><div className="text-xs text-slate-400 mt-1">Extract → Transform → Load · scheduled daily at 02:00</div></div>
          <button onClick={run} disabled={running} className="inline-flex items-center gap-2 bg-blue-400 hover:bg-blue-500 disabled:bg-blue-300 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition">
            <Icon n={running ? 'loader' : 'play'} size={16} className={running ? 'animate-spin' : ''} />{running ? 'Running…' : 'Run ETL Pipeline Now'}
          </button>
        </div>
      </Card>
      <Card title="Last 3 Runs">
        <ol className="relative border-l border-slate-200 ml-2 space-y-5">
          {runs.map(r => (
            <li key={r.id} className="pl-6 relative">
              <span className={`absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full ${r.ok ? 'bg-emerald-400' : 'bg-red-300'}`} />
              <div className="flex flex-wrap items-center gap-3">
                <span className={`text-xs px-2.5 py-0.5 rounded-full border ${r.ok ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-red-50 text-red-500 border-red-100'}`}>{r.ok ? 'Success' : 'Failed'}</span>
                <span className="text-sm text-slate-700">{r.t}</span><span className="text-xs text-slate-400">{r.d}</span>
              </div>
              {r.e && <div className="text-xs text-red-400 mt-1">{r.e}</div>}
            </li>))}
        </ol>
      </Card>
      <div>
        <h3 className="text-sm font-medium text-slate-600 mb-3">Warehouse Metadata</h3>
        <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
          {stats.map(([n, v]) => <div key={n} className="card p-4"><div className="text-xs text-slate-400 truncate">{n}</div><div className="text-lg font-semibold text-slate-800 mt-1">{v}</div><div className="text-xs text-slate-400">rows</div></div>)}
        </div>
      </div>
    </div>
  );
}

/* ---------- SHELL ---------- */
function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [f, setF] = useState({ year: 'All', quarter: 'All', month: 'All', state: 'All' });
  const [msg, setMsg] = useState(null);
  const toast = m => { setMsg(m); setTimeout(() => setMsg(null), 2800); };
  const set = k => v => setF({ ...f, [k]: v });
  return (
    <div className="flex min-h-screen">
      <aside className="w-16 md:w-60 shrink-0 bg-white border-r border-slate-200 flex flex-col sticky top-0 h-screen">
        <div className="h-16 flex items-center justify-center md:justify-start md:px-5 gap-2.5 border-b border-slate-100">
          <span className="w-8 h-8 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center"><Icon n="truck" size={17} /></span>
          <span className="hidden md:block font-semibold text-slate-800 text-sm">Olist Logistics DSS</span>
        </div>
        <nav className="p-3 space-y-1">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)} title={t.label}
              className={`w-full flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 rounded-xl text-sm transition ${activeTab === t.id ? 'bg-blue-50 text-blue-600 font-medium' : 'text-slate-500 hover:bg-slate-50'}`}>
              <Icon n={t.icon} /><span className="hidden md:inline">{t.label}</span>
            </button>))}
        </nav>
      </aside>
      <div className="flex-1 min-w-0">
        <header className="h-16 bg-white/90 backdrop-blur border-b border-slate-200 px-4 md:px-8 flex items-center justify-between gap-3 sticky top-0 z-10">
          <h1 className="text-base font-semibold text-slate-800 hidden lg:block">{TABS.find(t => t.id === activeTab).label}</h1>
          <div className="flex flex-wrap items-center gap-2 md:gap-3 ml-auto">
            {activeTab !== 'dss' && (<>
              <Select label="Year" value={f.year} onChange={set('year')} options={['All', '2016', '2017', '2018']} />
              <Select label="Quarter" value={f.quarter} onChange={set('quarter')} options={['All', ...QTRS]} />
              <Select label="Month" value={f.month} onChange={set('month')} options={['All', ...MONTHS]} />
              <Select label="State" value={f.state} onChange={set('state')} options={['All', ...STATES]} />
            </>)}
          </div>
        </header>
        <main className="p-4 md:p-8 max-w-[1400px]">
          {activeTab === 'dashboard' && <Dashboard f={f} />}
          {activeTab === 'dss' && <DSS toast={toast} />}
          {activeTab === 'olap' && <OLAP />}
          {activeTab === 'etl' && <ETL toast={toast} />}
        </main>
      </div>
      {msg && <div className="fixed bottom-6 right-6 fade bg-white border border-emerald-100 shadow-lg rounded-xl px-4 py-3 text-sm text-slate-700 flex items-center gap-2 z-50"><Icon n="check" size={16} className="text-emerald-500" />{msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
